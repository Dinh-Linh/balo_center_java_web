<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{users/app.component}">

<head>
    <title>Shopping Cart</title>
    <!-- Any page-specific CSS or JS links can go here -->
</head>

<body>

<div layout:fragment="content">
    <div class="container mx-auto mt-10">
        <div class="flex flex-col lg:flex-row shadow-md my-10">
            <div class="w-full lg:w-3/4 bg-white px-4 lg:px-10 py-10">
                <div class="flex justify-between border-b pb-8">
                    <h1 class="font-semibold text-2xl">Shopping Cart</h1>
                    <h2 class="font-semibold text-2xl" th:text="${cartItems != null ? #lists.size(cartItems) + ' Items' : '0 Items'}">0 Items</h2>
                </div>
                <div class="flex mt-10 mb-5">
                    <h3 class="font-semibold text-gray-600 text-xs uppercase w-2/5">Product Details</h3>
                    <h3 class="font-semibold text-center text-gray-600 text-xs uppercase w-1/5">Quantity</h3>
                    <h3 class="font-semibold text-center text-gray-600 text-xs uppercase w-1/5">Price</h3>
                    <h3 class="font-semibold text-center text-gray-600 text-xs uppercase w-1/5">Total</h3>
                </div>

                <!-- Cart items loop -->
                <div th:if="${cartItems != null and not #lists.isEmpty(cartItems)}">
                    <div th:each="item : ${cartItems}" class="flex items-center hover:bg-gray-100 -mx-4 lg:-mx-8 px-4 lg:px-6 py-5">
                        <div class="flex w-2/5"> <!-- product -->
                            <div class="w-20">
                                <img class="h-24" th:src="${item.product.thumbnail}" th:alt="${item.product.name}"/>
                            </div>
                            <div class="flex flex-col justify-between ml-4 flex-grow">
                                <span class="font-bold text-sm" th:text="${item.product.name}">Product Name</span>
                                <span class="text-red-500 text-xs" th:text="${item.product.category != null ? item.product.category.name : 'N/A'}">Category</span>
                                <a th:href="@{/cart/remove/{productId}(productId=${item.product.id})}" class="font-semibold hover:text-red-500 text-gray-500 text-xs">Remove</a>
                            </div>
                        </div>
                        <div class="flex justify-center w-1/5">
                            <a th:href="@{/cart/decrease/{productId}(productId=${item.product.id})}" class="px-2 py-1 border rounded">-</a>
                            <input class="mx-2 border text-center w-12" type="text" th:value="${item.quantity}" readonly="readonly"/>
                            <a th:href="@{/cart/increase/{productId}(productId=${item.product.id})}" class="px-2 py-1 border rounded">+</a>
                        </div>
                        <span class="text-center w-1/5 font-semibold text-sm" th:text="${#numbers.formatCurrency(item.product.price)}">$0.00</span>
                        <span class="text-center w-1/5 font-semibold text-sm" th:text="${#numbers.formatCurrency(item.product.price * item.quantity)}">$0.00</span>
                    </div>
                </div>

                <!-- Empty cart message -->
                <div th:if="${cartItems == null or #lists.isEmpty(cartItems)}" class="text-center py-10">
                    <p class="text-xl text-gray-500">Your cart is empty.</p>
                    <a th:href="@{/products}" class="mt-5 inline-block bg-indigo-500 hover:bg-indigo-600 text-white font-semibold py-2 px-4 rounded">
                        Continue Shopping
                    </a>
                </div>

                <a th:href="@{/products}" class="flex font-semibold text-indigo-600 text-sm mt-10">
                    <svg class="fill-current mr-2 text-indigo-600 w-4" viewBox="0 0 448 512">
                        <path
                            d="M134.059 296H436c6.627 0 12-5.373 12-12v-56c0-6.627-5.373-12-12-12H134.059v-46.059c0-21.382-25.851-32.09-40.971-16.971L7.029 239.029c-9.373 9.373-9.373 24.569 0 33.941l86.059 86.059c15.119 15.119 40.971 4.411 40.971-16.971V296z" />
                    </svg>
                    Continue Shopping
                </a>
            </div>

            <div id="summary" class="w-full lg:w-1/4 px-4 lg:px-8 py-10 bg-gray-100">
                <h1 class="font-semibold text-2xl border-b pb-8">Order Summary</h1>
                <div class="flex justify-between mt-10 mb-5">
                    <span class="font-semibold text-sm uppercase" th:text="${cartItems != null ? 'Items ' + #lists.size(cartItems) : 'Items 0'}">Items 0</span>
                    <span class="font-semibold text-sm" th:text="${totalAmount != null ? #numbers.formatCurrency(totalAmount) : #numbers.formatCurrency(0)}">$0.00</span>
                </div>
                <div>
                    <label class="font-medium inline-block mb-3 text-sm uppercase">Shipping</label>
                    <select class="block p-2 text-gray-600 w-full text-sm" name="shippingOption">
                        <option value="standard" th:attr="data-cost='10000'" selected="selected">Standard shipping - 10,000 VND</option>
                        <!-- Other shipping options can be added here -->
                    </select>
                </div>
                <div class="py-10">
                    <label for="promo" class="font-semibold inline-block mb-3 text-sm uppercase">Promo Code</label>
                    <input type="text" id="promo" placeholder="Enter your code" class="p-2 text-sm w-full" name="promoCode"/>
                </div>
                <button class="bg-red-500 hover:bg-red-600 px-5 py-2 text-sm text-white uppercase">Apply</button>
                <div class="border-t mt-8">
                    <div class="flex font-semibold justify-between py-6 text-sm uppercase">
                        <span>Total cost</span>
                        <!-- Assuming fixed shipping of 10000 for now. This should be dynamic. -->
                        <span th:text="${totalAmount != null ? #numbers.formatCurrency(totalAmount + 10000) : #numbers.formatCurrency(10000)}">$0.00</span>
                    </div>
                    <a th:href="@{/checkout}"
                       class="block text-center bg-indigo-500 font-semibold hover:bg-indigo-600 py-3 text-sm text-white uppercase w-full">
                        Checkout
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
