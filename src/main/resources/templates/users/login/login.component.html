<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{users/app.component}">

<head>
    <title>Login</title>
    <style>
        body {
            font-family: "Plus Jakarta Sans", "Noto Sans", sans-serif;
        }
    </style>
</head>

<body class="bg-neutral-100">

<div layout:fragment="content">
    <div class="relative flex size-full min-h-screen flex-col group/design-root overflow-x-hidden">
        <div class="layout-container flex h-full grow flex-col">
            <main class="flex flex-1 items-center justify-center py-8 px-4 sm:px-6 lg:px-8">
                <div class="w-full max-w-md space-y-8">
                    <div class="bg-white p-8 shadow-xl rounded-xl">
                        <h2 class="text-center text-3xl font-extrabold text-neutral-800 mb-2">Welcome back</h2>
                        <p class="text-center text-sm text-neutral-600 mb-8">
                            Enter your credentials to access your account.
                        </p>

                        <!-- Display login error message -->
                        <div th:if="${param.error}" class="mb-4 p-3 bg-red-100 text-red-700 border border-red-400 rounded-md">
                            Invalid username or password.
                        </div>
                        <div th:if="${param.logout}" class="mb-4 p-3 bg-green-100 text-green-700 border border-green-400 rounded-md">
                            You have been logged out.
                        </div>
                        <div th:if="${successMessage}" class="mb-4 p-3 bg-green-100 text-green-700 border border-green-400 rounded-md" th:text="${successMessage}">
                        </div>
                        <div th:if="${errorMessage}" class="mb-4 p-3 bg-red-100 text-red-700 border border-red-400 rounded-md" th:text="${errorMessage}">
                        </div>

                        <form class="space-y-6" th:action="@{/login}" method="post">
                            <div>
                                <label class="block text-sm font-medium text-neutral-700 pb-1.5" for="username">Email address</label>
                                <input autocomplete="email" class="form-input block w-full rounded-lg border-neutral-300 bg-neutral-50 shadow-sm focus:border-neutral-500 focus:ring-neutral-500 h-12 p-3 text-base placeholder-neutral-400" id="username" name="username" placeholder="you@example.com" required type="email"/>
                            </div>
                            <div>
                                <div class="flex items-center justify-between">
                                    <label class="block text-sm font-medium text-neutral-700 pb-1.5" for="password">Password</label>
                                    <a class="text-sm font-medium text-[#141414] hover:text-neutral-700 link-subtle" th:href="@{/forgot-password}">Forgot your password?</a>
                                </div>
                                <input autocomplete="current-password" class="form-input block w-full rounded-lg border-neutral-300 bg-neutral-50 shadow-sm focus:border-neutral-500 focus:ring-neutral-500 h-12 p-3 text-base placeholder-neutral-400" id="password" name="password" placeholder="••••••••" required type="password"/>
                            </div>
                            <div class="flex justify-center">
                                <button class="flex min-w-[120px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-6 @[480px]:h-14 @[480px]:px-8 bg-[#eb6c28] text-white text-base font-bold leading-normal tracking-[0.015em] @[480px]:text-lg @[480px]:font-bold @[480px]:leading-normal @[480px]:tracking-[0.015em] hover:bg-[#d95f21] transition-colors shadow-md" type="submit">
                                    Log in
                                </button>
                            </div>
                        </form>
                        <p class="mt-8 text-center text-sm text-neutral-500">
                            Don't have an account?
                            <a class="font-medium text-[#141414] hover:text-neutral-700 link-subtle" th:href="@{/signup}">Sign up</a>
                        </p>
                    </div>
                </div>
            </main>
        </div>
    </div>
</div>

</body>
</html>
